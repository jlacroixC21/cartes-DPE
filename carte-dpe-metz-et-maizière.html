iconCreateFunction:function(c){var ms=c.getAllChildMarkers();var ct={A:0,B:0,C:0,D:0,E:0,F:0,G:0};
ms.forEach(function(m){var d=m.options.dpe;if(ct[d]!==undefined)ct[d]++});

var am=[];var curDPE='all';var curDateFrom=0;var curDateTo=99999999;var curSurfMin=0;var curSurfMax=9999;var curType='all';var searchText='';

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function parseD(s){if(!s)return 0;var p=s.split('/');return parseInt(p[2]+p[1]+p[0],10)}

var locH='';if(r.et||r.po){var p=[];if(r.et)p.push('<b>'+esc(r.et)+'</b>');if(r.po)p.push(esc(r.po));locH='<div class="loc-info"><span>Localisation:</span> '+p.join(' - ')+'</div>'}

var surfMin=r.s?Math.max(0,Math.floor(r.s-2)):0;

var biLoc=slugC+(r.cp?"-"+r.cp:"");

m.bindPopup('<div class="dp"><span class="db" style="background:'+COL[r.d]+'">'+r.d+'</span><span class="tl">DPE '+r.d+'</span> '+pt+'<div class="ad">'+esc(r.a)+'</div><div class="ir"><b>Commune:</b> '+esc(r.c)+'<br><b>Type:</b> '+esc(r.t)+'<br><b>Surface:</b> '+sf+'<br><b>Conso:</b> '+co+'<br><b>GES:</b> '+ge+'<br><b>Periode:</b> '+(r.p||'N/C')+'</div>'+locH+dtH+lbcBtn+'</div>');
am.push(m)});
function getFiltered(){var res=[];D.forEach(function(r,idx){var ok1;if(curDPE==='OLD'){ok1=(r.o===1)}else{ok1=(!r.o)&&(curDPE==='all'||r.d===curDPE)}var dtInt=parseD(r.dt);var ok2=(dtInt>=curDateFrom&&dtInt<=curDateTo);var sv=r.s||0;var ok3=(sv===0||(sv>=curSurfMin&&sv<=curSurfMax));var ok4=(curType==='all'||r.t===curType);var ok5=(!searchText||r.a.toLowerCase().indexOf(searchText)>=0);if(ok1&&ok2&&ok3&&ok4&&ok5)res.push({r:r,idx:idx})});res.sort(function(a,b){return parseD(b.r.dt)-parseD(a.r.dt)});return res}
function applyFilters(){cl.clearLayers();var filtered=getFiltered();var nn=0;var nFG=0;filtered.forEach(function(item){cl.addLayer(am[item.idx]);nn++;if(item.r.d==='F'||item.r.d==='G')nFG++});document.getElementById('cnt').textContent=nn.toLocaleString('fr-FR');document.getElementById('pw').textContent=nFG+' passoires F/G';updateList(filtered)}
function updateList(filtered){var container=document.getElementById('list-items');var countEl=document.getElementById('list-count');countEl.textContent=filtered.length+' resultats';var html='';var max=500;var shown=Math.min(filtered.length,max);for(var i=0;i<shown;i++){var r=filtered[i].r;var idx=filtered[i].idx;var ip=r.d==='F'||r.d==='G';var passTag=ip?'<span class="list-passoire">PASSOIRE</span>':'';var sf=r.s?r.s+' m2':'';var typeLabel=r.t==='appartement'?'Appt':r.t==='maison'?'Maison':r.t==='immeuble'?'Immeuble':'';var etInfo=r.et?(r.et+' '):'';var cbInfo=r.cb?('<div class="list-details" style="color:rgba(255,255,255,.55)">Ref. bat. : '+esc(r.cb)+'</div>'):'';html+='<div class="list-item" data-idx="'+idx+'">';html+='<div class="list-dpe" style="background:'+(r.o?'#8e44ad':COL[r.d])+'">'+r.d+'</div>';html+='<div class="list-info"><div class="list-addr">'+esc(r.a)+passTag+'</div>';html+='<div class="list-details">'+typeLabel+' '+etInfo+(r.co?r.co+' kWh/m2/an':'')+'</div>'+cbInfo+'</div>';html+='<div class="list-right">';if(sf)html+='<div class="list-surf">'+sf+'</div>';if(r.dt)html+='<div class="list-date">'+r.dt+'</div>';html+='</div></div>'}if(filtered.length>max)html+='<div class="list-count">Affichage limite a '+max+' sur '+filtered.length+'</div>';container.innerHTML=html}
